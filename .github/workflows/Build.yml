name: Build PyStudio APK

# ---------------------------------------------------------------------------
# FULLY AUTOMATIC BUILD
#
#   1. finds the project ZIP inside the repository and unzips it
#   2. prepares JDK 17 + Python (buildPython) + the Android SDK
#      (NO third party setup-android action is used - the step that failed
#       before is replaced by our own, fault tolerant SDK setup)
#   3. builds the APK; Chaquopy bundles CPython + NumPy / SciPy / Matplotlib /
#      Pillow / OpenCV into it at build time
#   4. signs it with the FIXED keystore that ships inside the ZIP
#   5. publishes a new GitHub Release
#
# Runs on every push that contains/updates a .zip file, and manually from the
# Actions tab. No Secrets, no keystore generation, nothing to configure.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - '**'
    paths:
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pystudio-apk
  cancel-in-progress: false

env:
  # Keep these in one place: never change APPLICATION_ID (required so that a new
  # APK installs straight over the old one without uninstalling).
  PYSTUDIO_APPLICATION_ID: com.pystudio.app
  PYSTUDIO_COMPILE_SDK: "34"
  PYSTUDIO_BUILD_TOOLS: "34.0.0"

jobs:
  build:
    name: Build + sign + publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # --------------------------------------------------------- checkout --
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------------- ZIP --
      - name: Locate the project ZIP
        id: zip
        run: |
          set -euo pipefail
          ZIP_PATH=$(find . -maxdepth 4 -type f -iname '*.zip' -not -path './.git/*' | sort | head -n1 || true)
          if [ -z "${ZIP_PATH}" ]; then
            echo "::error::No .zip file found in the repository. Upload PyStudio-android.zip to the repository root (next to build.yml)."
            exit 1
          fi
          echo "Using ZIP: ${ZIP_PATH}"
          echo "zip=${ZIP_PATH}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------- toolchain ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy needs a real Python interpreter ("buildPython") on the build
      # machine to run pip and bundle the packages into the APK.
      - name: Set up Python (buildPython for Chaquopy)
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make buildPython ready (pip / setuptools / wheel)
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip --version
          echo "PYSTUDIO_BUILD_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      # ------------------------------------------------ Android SDK --------
      # Replaces `android-actions/setup-android@v3`, which failed in the run
      # reported by the user. GitHub's ubuntu runners already contain a full
      # Android SDK in /usr/local/lib/android/sdk; we only make sure that the
      # components the project needs really exist, and bootstrap a private SDK
      # from scratch if they do not.
      - name: Prepare the Android SDK
        id: sdk
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME}"
          PREINSTALLED="/usr/local/lib/android/sdk"
          if [ -d "${PREINSTALLED}/cmdline-tools" ] || [ -d "${PREINSTALLED}/platforms" ] || [ -d "${PREINSTALLED}/build-tools" ]; then
            SDK="${PREINSTALLED}"
            echo "Using the SDK that comes with the runner: ${SDK}"
          else
            SDK="${RUNNER_TEMP}/android-sdk"
            echo "Runner has no Android SDK - bootstrapping one in ${SDK}"
            mkdir -p "${SDK}/cmdline-tools"
            CLT_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            curl -fSL --retry 5 --retry-delay 5 -o /tmp/clt.zip "${CLT_URL}"
            unzip -q /tmp/clt.zip -d "${SDK}/cmdline-tools"
            if [ -d "${SDK}/cmdline-tools/cmdline-tools" ]; then
              mv "${SDK}/cmdline-tools/cmdline-tools" "${SDK}/cmdline-tools/latest"
            fi
          fi

          export ANDROID_HOME="${SDK}"
          export ANDROID_SDK_ROOT="${SDK}"
          mkdir -p "${ANDROID_HOME}"

          SDKM=""
          for cand in \
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME}/cmdline-tools/bin/sdkmanager" \
            "${ANDROID_HOME}/tools/bin/sdkmanager"; do
            if [ -x "${cand}" ]; then SDKM="${cand}"; break; fi
          done
          if [ -z "${SDKM}" ]; then
            SDKM=$(find "${ANDROID_HOME}" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n1 || true)
          fi
          if [ -z "${SDKM}" ]; then
            echo "::error::sdkmanager was not found inside ${ANDROID_HOME}"
            ls -la "${ANDROID_HOME}" || true
            exit 1
          fi
          echo "sdkmanager: ${SDKM}"

          # Accept the licences (never fatal - a missing licence only matters
          # if a component still has to be installed).
          yes | "${SDKM}" --licenses >/dev/null 2>&1 || true

          install_if_missing () {
            pkg="$1"; dir="$2"
            if [ -d "${dir}" ]; then
              echo "  already installed: ${pkg}"
            else
              echo "  installing: ${pkg}"
              yes | "${SDKM}" "${pkg}" >/dev/null 2>&1 || true
            fi
            if [ ! -d "${dir}" ]; then
              echo "::error::Failed to install ${pkg} into ${dir}"
              exit 1
            fi
          }
          install_if_missing "platform-tools"                                          "${ANDROID_HOME}/platform-tools"
          install_if_missing "platforms;android-${PYSTUDIO_COMPILE_SDK}"               "${ANDROID_HOME}/platforms/android-${PYSTUDIO_COMPILE_SDK}"
          install_if_missing "build-tools;${PYSTUDIO_BUILD_TOOLS}"                     "${ANDROID_HOME}/build-tools/${PYSTUDIO_BUILD_TOOLS}"

          # Publish the paths for the following steps.
          {
            echo "ANDROID_HOME=${ANDROID_HOME}"
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "sdk_dir=${ANDROID_HOME}"
          } >> "$GITHUB_ENV"

          echo "--- installed SDK content ---"
          ls -1 "${ANDROID_HOME}/platforms" || true
          ls -1 "${ANDROID_HOME}/build-tools" || true

      # --------------------------------------------------------- extract ---
      - name: Unzip the Android project
        id: unzip
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q -o "${{ steps.zip.outputs.zip }}" -d project
          echo "--- top level of the ZIP ---"
          find project -maxdepth 2 -print | head -40

          PROJECT_DIR="project"
          if [ ! -f project/settings.gradle.kts ] && [ ! -f project/settings.gradle ] \
             && [ ! -f project/build.gradle.kts ] && [ ! -f project/build.gradle ]; then
            INNER=$(find project -maxdepth 4 \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print | head -n1 | xargs -r dirname)
            if [ -n "${INNER}" ]; then
              PROJECT_DIR="${INNER}"
            else
              echo "::error::The ZIP does not contain a Gradle project (no settings.gradle found)."
              exit 1
            fi
          fi
          echo "project_dir=${PROJECT_DIR}" >> "$GITHUB_OUTPUT"
          echo "Using project dir: ${PROJECT_DIR}"
          chmod +x "${PROJECT_DIR}/gradlew" 2>/dev/null || true

          # AGP picks the SDK up from ANDROID_HOME, but local.properties makes
          # it explicit and avoids any ambiguity.
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > "${PROJECT_DIR}/local.properties"

      # --------------------------------------------------------- signing ---
      - name: Make sure the fixed signing keystore is present
        working-directory: ${{ steps.unzip.outputs.project_dir }}
        run: |
          set -euo pipefail
          mkdir -p app
          if [ -f app/pystudio-release.keystore ]; then
            echo "Keystore found in the project - the APK will be signed with the SAME key as every previous build."
          else
            echo "::warning::app/pystudio-release.keystore missing from the ZIP - generating a new one. To keep upgrades installable over the old version, always upload the ZIP unchanged."
            openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
              -keyout /tmp/pystudio-key.pem -out /tmp/pystudio-cert.pem \
              -days 10950 -subj "/C=IR/O=PyStudio/CN=PyStudio Release"
            openssl pkcs12 -export -name pystudio \
              -inkey /tmp/pystudio-key.pem -in /tmp/pystudio-cert.pem \
              -out app/pystudio-release.keystore -passout pass:pystudio
            rm -f /tmp/pystudio-key.pem /tmp/pystudio-cert.pem
          fi
          if [ ! -f keystore.properties ]; then
            printf '%s\n' \
              "storeFile=pystudio-release.keystore" \
              "storePassword=pystudio" \
              "keyAlias=pystudio" \
              "keyPassword=pystudio" \
              "storeType=PKCS12" > keystore.properties
          fi
          cat keystore.properties
          ls -la app/pystudio-release.keystore

      # ----------------------------------------------------------- build ---
      - name: Set up Gradle (only used if the wrapper is missing)
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          gradle-version: '8.9'

      - name: Build the signed release APK
        working-directory: ${{ steps.unzip.outputs.project_dir }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          PYSTUDIO_BUILD_PYTHON: ${{ env.PYSTUDIO_BUILD_PYTHON }}
        run: |
          set -euo pipefail
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "applicationId=${PYSTUDIO_APPLICATION_ID}"
          echo "versionCode=${VERSION_CODE}"
          echo "versionName=${VERSION_NAME}"
          echo "buildPython=${PYSTUDIO_BUILD_PYTHON}"
          echo "ANDROID_HOME=${ANDROID_HOME}"

          if [ -f ./gradlew ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          echo "Gradle command: ${GRADLE_CMD}"

          $GRADLE_CMD --no-daemon --stacktrace --warning-mode none \
            assembleRelease \
            -Ppystudio.versionCode="${VERSION_CODE}" \
            -Ppystudio.versionName="${VERSION_NAME}"

      # ------------------------------------------------------ verification -
      - name: Verify the signature and collect the APK
        id: apk
        run: |
          set -euo pipefail
          APK_DIR="${{ steps.unzip.outputs.project_dir }}/app/build/outputs/apk/release"
          echo "--- APK output folder ---"
          ls -la "${APK_DIR}"
          APK_SRC="${APK_DIR}/app-release.apk"
          if [ ! -f "${APK_SRC}" ]; then
            APK_SRC=$(find "${APK_DIR}" -type f -name '*.apk' | head -n1)
          fi
          if [ -z "${APK_SRC}" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          echo "APK: ${APK_SRC}"

          BT="${ANDROID_HOME}/build-tools/${PYSTUDIO_BUILD_TOOLS}"
          if [ ! -x "${BT}/apksigner" ]; then
            BT=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort | tail -n1)
          fi
          echo "--- apksigner verify ---"
          "${BT}/apksigner" verify --print-certs "${APK_SRC}" | head -20

          VERSION_NAME="1.0.${{ github.run_number }}"
          APK_OUT="PyStudio-${VERSION_NAME}.apk"
          cp "${APK_SRC}" "${GITHUB_WORKSPACE}/${APK_OUT}"
          echo "apk=${APK_OUT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          ls -la "${GITHUB_WORKSPACE}/${APK_OUT}"

      # ---------------------------------------------------------- artefact -
      # Always keep the APK on the run page as well, so it can be downloaded
      # even if publishing the release should ever fail.
      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyStudio-APK-${{ github.run_number }}
          path: ${{ github.workspace }}/${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 90

      # ---------------------------------------------------------- publish --
      - name: Publish a new release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: PyStudio ${{ steps.apk.outputs.version }}
          files: ${{ github.workspace }}/${{ steps.apk.outputs.apk }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## PyStudio ${{ steps.apk.outputs.version }}

            **به‌روزرسانی بدون حذف برنامه**: این APK با همان کلید امضای همیشگی و با
            همان `applicationId` و `versionCode` بزرگ‌تر ساخته شده است، پس می‌توانید
            آن را مستقیم روی نسخهٔ قبلی نصب کنید.

            | مورد | مقدار |
            | --- | --- |
            | versionName | `${{ steps.apk.outputs.version }}` |
            | versionCode | `${{ github.run_number }}` |
            | applicationId | `com.pystudio.app` |
            | امضا | `app/pystudio-release.keystore` (داخل ZIP پروژه) |
            | موتور اجرا | CPython 3.10 (Chaquopy) |

            ### کتابخانه‌های بسته‌شده در APK
            NumPy · SciPy · Matplotlib · Pillow · OpenCV — فقط کافی است `import` کنید.

            ### نصب کتابخانهٔ جدید
            * کتابخانه‌های pure-Python: از تب ترمینال → `pip install <name>`
            * کتابخانه‌های دارای کد بومی: اضافه‌کردن `install("<name>")` در بلوک
              `pip { }` داخل `app/build.gradle.kts` و آپلود دوبارهٔ ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
