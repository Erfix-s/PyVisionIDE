name: Build PyStudio APK

# ---------------------------------------------------------------------------
# Everything is automatic: it finds the ZIP in the repository, unzips it,
# builds the Android project, signs it with the keystore that is inside the ZIP
# and publishes a new GitHub Release with the APK.
#
# It runs whenever a .zip file is pushed/updated, and can also be started
# manually from the "Actions" tab.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - '**'
    paths:
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pystudio-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build + sign + publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------- ZIP ---
      - name: Locate the project ZIP
        id: zip
        run: |
          set -euo pipefail
          ZIP_PATH=$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' | sort | head -n1)
          if [ -z "$ZIP_PATH" ]; then
            echo "::error::No ZIP file found in the repository. Upload PyStudio-android.zip to the repository root."
            exit 1
          fi
          echo "Using ZIP: $ZIP_PATH"
          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------- toolchain ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy needs a real Python interpreter on the build machine.
      - name: Set up Python 3.11 (buildPython for Chaquopy)
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # --------------------------------------------------------- extract ---
      - name: Unzip the Android project
        id: unzip
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q -o "${{ steps.zip.outputs.zip }}" -d project
          echo "--- extracted files ---"
          find project -maxdepth 2 | head -40

          PROJECT_DIR=project
          if [ ! -f project/settings.gradle.kts ] && [ ! -f project/build.gradle ] && [ ! -f project/build.gradle.kts ]; then
            INNER=$(find project -maxdepth 3 -name 'settings.gradle*' -print | head -n1 | xargs -r dirname)
            if [ -n "$INNER" ]; then
              PROJECT_DIR="$INNER"
            fi
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using project dir: $PROJECT_DIR"

      # --------------------------------------------------------- signing ---
      - name: Ensure the fixed signing keystore exists
        working-directory: ${{ steps.unzip.outputs.project_dir }}
        run: |
          set -euo pipefail
          mkdir -p app
          if [ ! -f app/pystudio-release.keystore ]; then
            echo "Keystore was not in the ZIP - generating one (keep the ZIP unchanged to keep the same key)."
            openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
              -keyout /tmp/pystudio-key.pem -out /tmp/pystudio-cert.pem \
              -days 10950 -subj "/C=IR/O=PyStudio/CN=PyStudio Release"
            openssl pkcs12 -export -name pystudio \
              -inkey /tmp/pystudio-key.pem -in /tmp/pystudio-cert.pem \
              -out app/pystudio-release.keystore -passout pass:pystudio
            rm -f /tmp/pystudio-key.pem /tmp/pystudio-cert.pem
          fi
          if [ ! -f keystore.properties ]; then
            printf '%s\n' \
              "storeFile=pystudio-release.keystore" \
              "storePassword=pystudio" \
              "keyAlias=pystudio" \
              "keyPassword=pystudio" \
              "storeType=PKCS12" > keystore.properties
          fi
          echo "--- keystore ---"
          ls -la app/pystudio-release.keystore keystore.properties

      # ----------------------------------------------------------- build ---
      - name: Build the signed release APK
        working-directory: ${{ steps.unzip.outputs.project_dir }}
        env:
          PYSTUDIO_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "versionCode=$VERSION_CODE  versionName=$VERSION_NAME"
          echo "buildPython=$(command -v python3)"

          chmod +x gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          $GRADLE_CMD --no-daemon --stacktrace --warning-mode none \
            assembleRelease \
            -Ppystudio.versionCode="$VERSION_CODE" \
            -Ppystudio.versionName="$VERSION_NAME"

      # -------------------------------------------------------- artefacts --
      - name: Verify the APK signature and rename the APK
        run: |
          set -euo pipefail
          APK_DIR="${{ steps.unzip.outputs.project_dir }}/app/build/outputs/apk/release"
          ls -la "$APK_DIR"
          APK_SRC="$APK_DIR/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC=$(find "$APK_DIR" -name '*.apk' | head -n1)
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -n1)
          "$BT/apksigner" verify --print-certs "$APK_SRC" | head -20
          VERSION_NAME="1.0.${{ github.run_number }}"
          APK_OUT="PyStudio-${VERSION_NAME}.apk"
          cp "$APK_SRC" "$GITHUB_WORKSPACE/$APK_OUT"
          echo "apk=$APK_OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          ls -la "$GITHUB_WORKSPACE/$APK_OUT"
        id: apk

      # ---------------------------------------------------------- publish --
      - name: Publish a new release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: PyStudio ${{ steps.apk.outputs.version }}
          files: ${{ github.workspace }}/${{ steps.apk.outputs.apk }}
          body: |
            ## PyStudio ${{ steps.apk.outputs.version }}

            **نصب روی نسخه قبلی**: این فایل APK با همان کلید امضای همیشگی ساخته شده
            و `applicationId` تغییر نکرده است، پس می‌توانید آن را مستقیم روی نسخه
            قبلی نصب کنید (نیازی به حذف برنامه نیست).

            - versionCode: `${{ github.run_number }}`
            - versionName: `${{ steps.apk.outputs.version }}`
            - Python: CPython 3.11 (Chaquopy) + NumPy / SciPy / Matplotlib / Pillow / OpenCV
            - امضا: `app/pystudio-release.keystore` (داخل ZIP پروژه)
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
