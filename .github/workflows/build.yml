name: Build PyStudio APK

# Runs automatically whenever a ZIP file in the repository root is added or updated
# (or when this workflow file itself is added/changed).
on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pystudio-build
  cancel-in-progress: false

env:
  PYSTUDIO_RUN_NUMBER: ${{ github.run_number }}
  PYSTUDIO_BUILD_NUMBER: ${{ github.run_number }}
  PYSTUDIO_VERSION_NAME: 1.0.${{ github.run_number }}
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Find and unzip the Android project
        id: unzip
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          if [ -f "PyStudio-Android-Project.zip" ]; then
            ZIP="PyStudio-Android-Project.zip"
          else
            ZIP="$(ls -1 ./*.zip 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP file found in the repository root."
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf "$RUNNER_TEMP/project"
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/project"
          SETTINGS="$(find "$RUNNER_TEMP/project" -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) not found inside the ZIP."
            exit 1
          fi
          DIR="$(dirname "$SETTINGS")"
          echo "Project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10 (needed by Chaquopy at build time)
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify the bundled signing key
        shell: bash
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: |
          set -euo pipefail
          PROPERTIES="keystore.properties"
          if [[ ! -f "$PROPERTIES" ]]; then
            echo "::error::keystore.properties not found."
            exit 1
          fi

          property() {
            awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$PROPERTIES"
          }

          STORE_FILE="$(property storeFile)"
          STORE_TYPE="$(property storeType)"
          STORE_PASSWORD="$(property storePassword)"
          KEY_ALIAS="$(property keyAlias)"

          if [[ -z "$STORE_FILE" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Signing configuration is incomplete in keystore.properties."
            exit 1
          fi
          if [[ ! -f "$STORE_FILE" ]]; then
            echo "::error::Signing keystore not found: $STORE_FILE"
            exit 1
          fi

          export KEYSTORE_PASSWORD="$STORE_PASSWORD"
          if ! keytool -list \
            -keystore "$STORE_FILE" \
            -storetype "${STORE_TYPE:-PKCS12}" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" >/dev/null; then
            echo "::error::Could not verify signing key from keystore.properties."
            exit 1
          fi
          echo "Verified signing key: $STORE_FILE ($KEY_ALIAS)"

      - name: Build and sign release APK
        shell: bash
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: |
          set -euo pipefail
          python3.10 --version
          java -version

          # Tell Gradle where the Android SDK is
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

          # Init script: turn off every lint task (lintVitalRelease often breaks assembleRelease)
          INIT="$RUNNER_TEMP/disable-lint.gradle"
          cat > "$INIT" <<'EOF'
          allprojects {
              tasks.configureEach { t ->
                  if (t.name.startsWith("lint")) {
                      t.enabled = false
                  }
              }
          }
          EOF

          # Use the project's wrapper if it is complete, otherwise the installed Gradle
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          echo "Using: $GRADLE_CMD"

          LOG="$RUNNER_TEMP/gradle-build.log"
          set +e
          $GRADLE_CMD \
            --no-daemon \
            --stacktrace \
            --warning-mode=summary \
            --init-script "$INIT" \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            "-Pkotlin.daemon.jvm.options=-Xmx2g" \
            -Pandroid.useAndroidX=true \
            assembleRelease 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            # Build a short, safe summary of the failure
            SUMMARY="$RUNNER_TEMP/build-error.log"
            {
              echo "=== run ${GITHUB_RUN_NUMBER} / commit ${GITHUB_SHA} ==="
              echo ""
              echo "=== WHAT WENT WRONG ==="
              grep -n -A14 "What went wrong" "$LOG" | head -n 80 || true
              echo ""
              echo "=== KOTLIN / JAVA / AAPT COMPILE ERRORS ==="
              grep -nE "^e: |error:|AAPT:|Execution failed|Could not (resolve|find|get)|Unsupported|incompatible|pip|Chaquopy|chaquo" "$LOG" | head -n 60 || true
              echo ""
              echo "=== LAST 80 LINES ==="
              tail -n 80 "$LOG"
            } | sed -E 's/([Pp]assword[A-Za-z]*[=: ]+).*/\1***/' > "$SUMMARY"

            echo "================ KEY ERROR LINES ================"
            sed -n '1,80p' "$SUMMARY"
            echo "::error title=Gradle build failed::exit code $STATUS - see build-logs branch / gradle-build-log artifact"
            exit "$STATUS"
          fi

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            ${{ runner.temp }}/gradle-build.log
            ${{ runner.temp }}/build-error.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish error summary to build-logs branch
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SUMMARY="$RUNNER_TEMP/build-error.log"
          if [ ! -f "$SUMMARY" ]; then
            echo "No summary file, skipping."
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/logpub"
          mkdir -p "$RUNNER_TEMP/logpub"
          cp "$SUMMARY" "$RUNNER_TEMP/logpub/build-error.log"
          cd "$RUNNER_TEMP/logpub"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b build-logs
          git add build-error.log
          git commit -q -m "Build error log for run ${GITHUB_RUN_NUMBER}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f -q origin build-logs
          echo "Pushed log to branch build-logs (file: build-error.log)"

      - name: Prepare APK
        id: apk
        shell: bash
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: |
          set -euo pipefail
          SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          VERSION="1.0.${PYSTUDIO_RUN_NUMBER}"
          OUT="$GITHUB_WORKSPACE/PyStudio-v${VERSION}.apk"
          cp "$SRC" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OUT" | head -n 3
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$OUT" | head -n 1
          ls -lh "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyStudio-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: PyStudio ${{ steps.apk.outputs.version }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## PyStudio ${{ steps.apk.outputs.version }}

            Download **PyStudio-v${{ steps.apk.outputs.version }}.apk** below and install it.

            Every build is signed with the same key, so it installs over the previous
            version without uninstalling - your files are kept.

            Build number: ${{ github.run_number }} - Commit: ${{ github.sha }}
