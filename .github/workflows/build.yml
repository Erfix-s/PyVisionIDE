name: Build and publish PyStudio APK

# Upload or update the project ZIP anywhere in the repo, and this workflow builds,
# signs and publishes a new release automatically. No repository secrets required.
on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: pystudio-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: Unzip, sign and release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate and unzip the Android project
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$(find . -maxdepth 2 -type f -name '*.zip' -not -path './.git/*' | sort | head -n 1)"
          if [ -z "$ZIP_PATH" ]; then
            echo "No ZIP found in the repository root." >&2
            exit 1
          fi
          echo "Using archive: $ZIP_PATH"
          rm -rf _source
          mkdir -p _source
          unzip -q "$ZIP_PATH" -d _source
          APP_DIR="$(find _source -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$APP_DIR" ]; then
            echo "settings.gradle was not found inside the ZIP." >&2
            exit 1
          fi
          if [ ! -f "$APP_DIR/keystore/pystudio-release.p12" ]; then
            echo "The fixed release keystore is missing from the ZIP." >&2
            exit 1
          fi
          echo "Android project: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Set up Python 3.10 (Chaquopy build interpreter)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Resolve Android SDK location
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compute automatic version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "PYSTUDIO_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "PYSTUDIO_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Building $VERSION_NAME (versionCode $((1000 + GITHUB_RUN_NUMBER)))"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$APP_DIR" assembleRelease --stacktrace
          APK="$APP_DIR/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "APK was not produced at $APK" >&2
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          cp "$APK" "PyStudio-${PYSTUDIO_VERSION_NAME}-universal.apk"
          sha256sum "PyStudio-${PYSTUDIO_VERSION_NAME}-universal.apk" > "PyStudio-${PYSTUDIO_VERSION_NAME}-universal.apk.sha256"
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK")"
          echo "$BADGING" | head -n 1
          echo "$BADGING" | grep -q "package: name='ir.pystudio.app'" || { echo "applicationId changed!" >&2; exit 1; }
          echo "APK_PATH=PyStudio-${PYSTUDIO_VERSION_NAME}-universal.apk" >> "$GITHUB_ENV"
          echo "SHA_PATH=PyStudio-${PYSTUDIO_VERSION_NAME}-universal.apk.sha256" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "PyStudio ${{ env.PYSTUDIO_VERSION_NAME }}"
          make_latest: true
          generate_release_notes: true
          body: |
            PyStudio ${{ env.PYSTUDIO_VERSION_NAME }} — signed with the project's fixed release key.

            - versionCode: ${{ github.run_number }} + 1000
            - applicationId: ir.pystudio.app
            - Architectures: arm64-v8a, armeabi-v7a (one universal APK)
            - Built from commit ${{ github.sha }}

            Install this APK directly over an older PyStudio release; no uninstall is needed.
          files: |
            ${{ env.APK_PATH }}
            ${{ env.SHA_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
